name: Gradespace CI

# Replaces T3's CI, which needs their build machines and private task cache.
# Linux only, because macOS minutes are the scarce ones on this plan.
on:
  push:
    branches: [mine]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradespace-ci-${{ github.ref }}
  cancel-in-progress: true

# Tests run apart from the checks and from each other, so a browser crash on one
# runner fails one job, and re-running it does not repeat the rest.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci-deps

      - name: Prepare Electron
        run: vp run --filter @t3tools/desktop ensure:electron

      # Each check runs even if an earlier one fails, so one run reports everything.
      - name: Format and lint
        run: vp run fmt:check && vp run lint

      - name: Gradespace wording
        if: ${{ !cancelled() }}
        run: vp run check:gs-wording

      - name: Type check
        if: ${{ !cancelled() }}
        run: vp run typecheck

  test_packages:
    name: Test packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci-deps

      - name: Install libsecret for the native helper test
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Prepare Electron for the desktop tests
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install Chromium
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: >-
          vp run --concurrency-limit 1
          --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

  test_server:
    name: Test server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci-deps

      - name: Install Chromium for the preview tests
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # Browser tests time out when they share a runner with other suites.
  test_web:
    name: Test web ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-ci-deps

      - name: Install Chromium for the web browser tests
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run --filter @t3tools/web test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
